<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #f5f4f2; }</style>
</head>
<body>
  <div class="pb pb-f pb-link lk" data-state="edit">
    <div class="lk-plate"><div class="lk-well">
      <span class="lk-ring" aria-hidden="true"></span>
      <input type="text" inputmode="url" aria-label="Link" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Paste a link" data-bwignore="true" data-1p-ignore="true" data-lpignore="true" data-form-type="other">
      <button class="lk-row" type="button"><span class="lk-line"><span class="lk-pre"></span><span class="lk-run"><span class="lk-host"></span><span class="lk-tail"></span></span></span><span class="lk-badge" aria-hidden="true"></span></button>
      <button class="lk-clear" type="button" aria-label="Clear link" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div></div>
    <span class="pb-sr" role="status" aria-live="polite"></span>
  </div>
</body>
</html>
