<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pill meter</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script src="./buttons.js" defer></script><script src="./preview.js" defer></script><script src="./example.js" defer></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f4f2;font-family:"Instrument Sans",sans-serif}body.embedded{background:transparent}.sl-slider{width:min(320px,calc(100vw - 40px))}.sl-slider--vertical{width:min(178px,calc(100vw - 40px))}</style></head><body><div class="sl-slider sl-slider--vertical slider-meter" data-slider="meter" data-format="percent"   style="--low:0%;--high:65%;--position:65%;--fraction:0.65;--zoom:0.65;--preview-value:65px"><div class="slider-header"><label for="next-meter">Level</label><output for="next-meter" data-output>65%</output></div><div class="slider-track"><span class="slider-rail" aria-hidden="true"><span class="slider-fill"></span></span><input class="slider-input" id="next-meter" name="meter" type="range" min="0" max="100" step="1" value="65" aria-orientation="vertical"></div><div class="meter-endpoints" aria-hidden="true"><span>0</span><span>100</span></div></div></body></html>
