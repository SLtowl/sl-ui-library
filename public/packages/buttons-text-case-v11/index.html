<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text case · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-text-case" data-state="sentence" data-layout="compact" aria-label="Text case">
    <div class="editor-shell"><div class="tool-row" role="toolbar" aria-label="Text case tools"><button class="motion-button" type="button" data-action aria-label="Change text to uppercase" title="Change text to uppercase">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><path class="case-large" d="M4 18 9 6l5 12M6 14h6"/><path class="case-small" d="M15 12.5c1.2-1 4-1 4 1v4.5m0-3.5c-4-1-5.5 3.5-1.5 3.5 1 0 1.5-.6 1.5-.6"/></svg></span><span class="button-label" data-label>Uppercase</span></span>
    </button></div><div class="sample-window" data-preview aria-hidden="true"><div class="sample-copy">Release Notes</div></div></div>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Sentence case.</p>
  </section>
</body>
</html>
