<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stepped density</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script src="./buttons.js" defer></script><script src="./preview.js" defer></script><script src="./example.js" defer></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f4f2;font-family:"Instrument Sans",sans-serif}body.embedded{background:transparent}.sl-slider{width:min(320px,calc(100vw - 40px))}.sl-slider--vertical{width:min(178px,calc(100vw - 40px))}</style></head><body><div class="sl-slider sl-slider--steps" data-slider="steps" data-labels="Compact,Comfortable,Spacious"><div class="slider-header"><label for="slider-steps">Density</label><output for="slider-steps" data-output>Comfortable</output></div><div class="slider-track"><span class="slider-rail" aria-hidden="true"><span class="slider-fill"></span></span><input class="slider-input" id="slider-steps" name="density" type="range" min="0" max="2" step="1" value="1"></div><div class="slider-step-labels" aria-hidden="true"><span data-step="0">Compact</span><span data-step="1">Comfortable</span><span data-step="2">Spacious</span></div></div></body></html>
