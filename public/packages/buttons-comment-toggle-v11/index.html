<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comment on selection · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-comment-toggle" data-state="clear" data-active="false" aria-label="Comment on selection">
    <div class="sample-window" data-preview aria-hidden="true"><div class="comment-scene"><span class="comment-source"><i></i><b></b><u></u></span><span class="comment-bubble"><i></i><b></b></span><em>1</em></div></div>
    <button class="motion-button" type="button" data-action aria-label="Comment on the selected text" title="Comment on the selected text" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><path class="comment-page" d="M4 3.5h11v17H4zM7 7h5M7 10h4"/><path class="comment-bubble" d="M10 11h10v7h-5l-3 2v-2h-2z"/><path class="comment-plus" d="M15 13v3m-1.5-1.5h3"/><path class="comment-check" pathLength="1" d="m13.5 14.5 1.5 1.5 3-3"/></svg></span><span class="button-label" data-label>Add comment</span></span>
    </button>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Selected text has no comment.</p>
  </section>
</body>
</html>
