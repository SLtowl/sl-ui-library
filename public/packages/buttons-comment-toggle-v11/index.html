<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add comment · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-comment-toggle" data-state="none" data-active="false" aria-label="Add comment">
    <div class="sample-window" data-preview aria-hidden="true"><div class="comment-sample"><span><i></i><b></b></span><em>1</em></div></div>
    <button class="motion-button" type="button" data-action aria-label="Add a local comment" title="Add a local comment" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><path class="comment-bubble" d="M4 5.5h16v11H9l-4 3v-3H4z"/><path class="comment-plus" d="M12 8.5v5m-2.5-2.5h5"/><path class="comment-check" pathLength="1" d="m9.5 11 2 2 4-4"/></svg></span><span class="button-label" data-label>Add comment</span></span>
    </button>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">No comment is attached.</p>
  </section>
</body>
</html>
