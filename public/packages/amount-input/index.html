<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Matte Amount input</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./preview.js" defer></script>
  <script src="./example.js" defer></script>
  <style>
    body { margin: 0; min-height: 100svh; padding: 24px; box-sizing: border-box; display: grid; place-content: center; background: #f5f4f2; font-family: 'Instrument Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    body.embedded { background: transparent; }
    .example-note { position: fixed; bottom: 14px; inset-inline: 16px; margin: 0; color: #515555; font-size: 12px; line-height: 1.5; text-align: center; }
    .embedded .example-note { display: none; }
  </style>
</head>
<body>
  <div class="sl-field sl-field--amount" id="amount-field" data-amount-state="formatted">
            <div class="sl-field__control">
              <span class="sl-field__currency" aria-hidden="true">$</span>
              <input class="sl-field__input" id="demo-amount" type="text" placeholder=" " value="1,250" autocomplete="off" inputmode="decimal" aria-describedby="amount-help">
              <label class="sl-field__label" for="demo-amount">Amount</label>
              <span class="sl-field__currency-code" aria-hidden="true">USD</span>
            </div>
            <p class="sl-field__helper" id="amount-help" role="status" aria-live="polite">Formatting is applied when you leave the field.</p>
          </div>
  <p class="example-note">Formats a local numeric value. No payment is created.</p>
</body>
</html>
