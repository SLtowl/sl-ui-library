<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <style>html,body{background-color:#f5f4f2;color:#202222}body{margin:0}</style>
  <title>Matte Upload button</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./preview.js" defer></script>
  <script src="./example.js" defer></script>
  <style>
    body { min-height: 100svh; display: grid; place-content: center; font-family: 'Instrument Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    body.embedded { background: transparent; }
    .upload-feedback, .example-note { position: fixed; left: 16px; right: 16px; margin: 0; color: #515555; font-size: 12px; line-height: 1.5; text-align: center; }
    .upload-feedback { bottom: 14px; }
    .example-note { bottom: 50px; }
    .embedded .example-note { display: none; }
  </style>
</head>
<body>
  <button class="sl-upload" id="upload-button" type="button" aria-label="Upload file" data-upload-state="idle" disabled>
          <span class="sl-upload__surface" aria-hidden="true">
            <span class="sl-upload__wash"></span>
            <span class="sl-upload__icon">
              <svg viewBox="0 0 24 24" fill="none" focusable="false">
                <path class="sl-upload__arrow" d="M12 15.5V4m-4 4 4-4 4 4"/>
                <path class="sl-upload__tray" d="M4.5 16.5v4h15v-4"/>
                <path class="sl-upload__progress" d="M4.5 20.5h15"/>
                <path class="sl-upload__check" d="m4 12.5 5 5L20 6.5" pathLength="1"/>
              </svg>
            </span>
            <span class="sl-upload__label">Upload</span>
          </span>
        </button>
  <input id="upload-input" type="file" hidden aria-label="Choose a file">
  <p class="upload-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
  <p class="example-note">Local file selection only. Supply onUpload in example.js to upload a file.</p>
</body>
</html>
