<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>List style · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-list-style" data-state="bullets" data-layout="compact" aria-label="List style">
    <div class="editor-shell"><div class="tool-row" role="toolbar" aria-label="List style tools"><button class="motion-button" type="button" data-action aria-label="Change list to numbers" title="Change list to numbers">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><g class="list-marks"><circle cx="5" cy="7" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="17" r="1"/></g><g class="list-numbers"><path d="M4.2 5.8h1v2.4M4 11h1.7l-1.7 2h1.8M4 16h1.7L4.3 17l1.4 1H4"/></g><path class="list-checks" pathLength="1" d="m3.5 7 1 1 2-2m-3 6 1 1 2-2m-3 6 1 1 2-2"/><path class="list-rows" d="M9 7h11M9 12h11M9 17h11"/></svg></span><span class="button-label" data-label>Use numbers</span></span>
    </button></div><div class="sample-window" data-preview aria-hidden="true"><div class="sample-list"><div><b></b><i></i></div><div><b></b><i></i></div><div><b></b><i></i></div></div></div></div>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Bulleted list.</p>
  </section>
</body>
</html>
