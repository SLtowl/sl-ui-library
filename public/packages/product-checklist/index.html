<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #f5f4f2; }</style>
</head>
<body>
  <div class="pb pb-f pb-checklist ck ck-plate" style="--n:1;--total:3">
    <div class="ck-progress"><div class="ck-swap"><span>Get started</span><span class="on">1 of 3 done</span><span>2 of 3 done</span><span>All done</span></div><span class="ck-rail"><i></i></span></div>
    <label class="ck-row"><input type="checkbox" checked><span class="ck-box"><svg viewBox="0 0 22 22" aria-hidden="true"><path class="ck-tick" pathLength="1" d="M6 11.5l3.5 3.5L16 7.5"/></svg></span><span class="ck-text">Verify your email</span></label>
    <label class="ck-row"><input type="checkbox"><span class="ck-box"><svg viewBox="0 0 22 22" aria-hidden="true"><path class="ck-tick" pathLength="1" d="M6 11.5l3.5 3.5L16 7.5"/></svg></span><span class="ck-text">Add a photo</span></label>
    <label class="ck-row"><input type="checkbox"><span class="ck-box"><svg viewBox="0 0 22 22" aria-hidden="true"><path class="ck-tick" pathLength="1" d="M6 11.5l3.5 3.5L16 7.5"/></svg></span><span class="ck-text">Invite a teammate</span></label>
  </div>
</body>
</html>
