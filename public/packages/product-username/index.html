<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Username · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #f5f4f2; }</style>
</head>
<body>
  <div class="pb pb-f pb-username un" data-state="empty">
    <div class="un-plate">
      <div class="un-clip un-shade-clip" aria-hidden="true"><div class="un-shade"></div></div>
      <div class="un-clip" aria-hidden="true"><div class="un-sheet"></div></div>
      <div class="un-head"><label class="un-well">
        <span class="un-ring" aria-hidden="true"></span>
        <input type="text" role="combobox" aria-label="Username" aria-expanded="false" aria-autocomplete="list" aria-controls="pb-username-list" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="20" placeholder="Username" data-bwignore="true" data-1p-ignore="true" data-lpignore="true" data-form-type="other">
        <svg class="un-ok" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="m5 12.5 4.5 4.5L19 7.5"/></svg>
        <span class="un-taken" aria-hidden="true">Taken</span>
      </label></div>
      <div class="un-reveal"><div class="un-list" id="pb-username-list" role="listbox" aria-label="Free names"><span class="un-knob" aria-hidden="true"></span></div></div>
    </div>
    <span class="pb-sr" role="status" aria-live="polite"></span>
  </div>
</body>
</html>
