<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Project section tabs</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./buttons.css">

<script src="./example.js" defer></script>
<style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#edf0f1;padding:24px;box-sizing:border-box}</style>
</head>
<body>
<div class="sl-component" data-kind="navigation-overflow-tabs-v11">
<header class="nv-heading"><div><span class="nv-kicker">Project navigation</span><h2>Project sections</h2></div><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M7 5V3h6v2M7 14h4m-4 3h8"/></svg></header>
<div class="nv-tabstrip" role="tablist" aria-label="Project sections">
  <button type="button" role="tab" data-tab="0" aria-selected="true" tabindex="0" class="nv-button">Overview</button>
  <button type="button" role="tab" data-tab="1" aria-selected="false" tabindex="-1" class="nv-button">Files</button>
  <button type="button" role="tab" data-tab="2" aria-selected="false" tabindex="-1" class="nv-button">Notes</button>
  <button type="button" role="tab" data-tab="3" aria-selected="false" tabindex="-1" class="nv-button">People</button>
  <button type="button" role="tab" data-tab="4" aria-selected="false" tabindex="-1" class="nv-button">Activity</button>
  <button type="button" role="tab" data-tab="5" aria-selected="false" tabindex="-1" class="nv-button">Settings</button>
</div>
<section class="nv-detail" role="tabpanel" tabindex="0">
  <span class="nv-kicker" data-meta>Section 1 of 6</span>
  <h3 data-title>Project overview</h3>
  <p data-copy>Three active milestones. The interface review is next.</p>
</section>
</div>
</body>
