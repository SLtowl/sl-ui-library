<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tag assignment menu</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f5f4f2; padding: 24px; box-sizing: border-box; }</style>
</head>
<body>
  <div class="sl-component" data-kind="menus-tag-workbench-v11" data-open="false">
    <p class="sl-eyebrow">Release brief</p>
    <button class="sl-trigger" data-trigger type="button" aria-expanded="false" aria-haspopup="dialog"><svg class="" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M4 4h8l9 9-8 8-9-9Z"/><circle cx="8" cy="8" r="1"/></svg><span data-label>Edit assigned tags</span><svg class="sl-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="m7 10 5 5 5-5"/></svg></button>
    <div class="sl-panel" data-panel tabindex="-1" role="dialog" aria-label="Tag assignment menu" aria-hidden="true" inert>
      <label class="sl-search"><svg class="" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input data-search type="search" aria-label="Find or create a tag" placeholder="Find or create a tag" autocomplete="off" spellcheck="false"></label><div class="sl-scroll"><div data-tags></div><p data-empty class="sl-empty" hidden>No matching tags.</p><button type="button" class="sl-action" data-key="create" hidden>Create tag</button></div><div class="sl-footer"><button type="button" class="sl-action" data-key="dismiss" >Cancel</button><button type="button" class="sl-action" data-key="apply" >Apply</button></div>
    </div>
    <div class="sl-summary" role="region" aria-label="Local result" tabindex="0"><p><strong data-summary>Design</strong></p><small>Create and apply your own labels.</small></div>
    <p class="sl-feedback" data-feedback role="status" aria-live="polite">Changes stay in the draft until Apply.</p>
  </div>
</body>
</html>
