<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Italic text · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-text-italic" data-state="regular" data-layout="compact" aria-label="Italic text">
    <div class="editor-shell"><div class="tool-row" role="toolbar" aria-label="Italic text tools"><button class="motion-button" type="button" data-action aria-label="Turn on italic text" title="Turn on italic text" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><path class="italic-cap" d="M9 5h8M7 19h8"/><path class="italic-stem" d="m14.5 5-5 14"/></svg></span><span class="button-label" data-label>Italic</span></span>
    </button></div><div class="sample-window" data-preview aria-hidden="true"><div class="sample-copy">Small details matter</div></div></div>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Upright text.</p>
  </section>
</body>
</html>
