<body>
  <section class="sl-component" data-kind="sliders-gain-v11" aria-label="Logarithmic gain">
    <h2 class="sl-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7m5 0h6M3 17h12m5 0h1"/><rect x="10" y="3.5" width="5" height="7" rx="1.5"/><rect x="15" y="13.5" width="5" height="7" rx="1.5"/></svg>Logarithmic gain</h2>

    <div class="sl-gain"><strong data-multiplier>0.5012×</strong><span>amplitude multiplier</span></div><svg class="sl-curve" viewBox="0 0 240 48" aria-hidden="true"><path class="sl-guide" d="M1 46H239M199.33 3V46"/><path data-gain-curve d="M1 45.99L100.17 45.65L149.75 44.03L179.5 40.46L199.33 34.95L219.17 23.95L239 2"/><circle data-gain-dot cx="179.5" cy="40.46" r="3"/></svg>

    <div class="sl-actions"><button type="button" data-action="mute" aria-pressed="false">Mute</button><button type="button" data-action="unity">Unity · 0 dB</button></div>
