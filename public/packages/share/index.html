<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <style>html,body{background-color:#f5f4f2;color:#202222}body{margin:0}</style>
  <title>Matte Share button</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./preview.js" defer></script>
  <script src="./example.js" defer></script>
  <style>
    body { min-height: 100svh; display: grid; place-content: center; font-family: 'Instrument Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    body.embedded { background: transparent; }
    .share-feedback, .example-note { position: fixed; left: 16px; right: 16px; margin: 0; color: #515555; font-size: 12px; line-height: 1.5; text-align: center; }
    .share-feedback { bottom: 14px; }
    .example-note { bottom: 50px; }
    .embedded .example-note { display: none; }
  </style>
</head>
<body>
  <div class="sl-share-control">
          <button class="sl-share" type="button" aria-label="Share link" aria-expanded="false" disabled>
            <span class="sl-share__surface" aria-hidden="true"><span class="sl-share__icon"><svg viewBox="0 0 24 24" fill="none" focusable="false"><circle cx="6" cy="12" r="2.6"/><g class="sl-share__upper"><path d="m8.4 10.7 7.2-4"/><circle cx="18" cy="5.4" r="2.6"/></g><g class="sl-share__lower"><path d="m8.4 13.3 7.2 4"/><circle cx="18" cy="18.6" r="2.6"/></g></svg></span><span class="sl-share__label">Share</span></span>
          </button>
          <div class="sl-share__popover" role="group" aria-label="Share link options" aria-hidden="true" inert>
            <input class="sl-share__url" type="text" readonly aria-label="Link to share" spellcheck="false">
            <button class="sl-share__copy" type="button">Copy link</button>
            <button class="sl-share__send" type="button" hidden>Share…</button>
          </div>
        </div>
  <p class="share-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
  <p class="example-note">Uses an example.com link. Copy link writes it to your clipboard; Share uses native sharing when available.</p>
</body>
</html>
