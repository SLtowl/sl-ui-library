<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New folder · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-new-folder" data-state="empty" data-active="false" aria-label="New folder">
    <div class="sample-window" data-preview aria-hidden="true"><div class="folder-scene"><span class="folder-back"></span><i class="folder-doc doc-one"></i><i class="folder-doc doc-two"></i><b class="folder-front"></b></div></div>
    <button class="motion-button" type="button" data-action aria-label="Create a local folder" title="Create a local folder" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><path class="folder-back-icon" d="M3.5 8h7l2-2h8v12.5h-17z"/><path class="folder-sheet-icon" d="M8 9.5h8v7H8zM10 12h4"/><path class="folder-front-icon" d="M3.5 11h17l-1.5 9H5z"/><path class="folder-plus" d="M12 12v5m-2.5-2.5h5"/><path class="folder-check" pathLength="1" d="m9.5 14.5 2 2 4-4"/></svg></span><span class="button-label" data-label>New folder</span></span>
    </button>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">No demo folder exists.</p>
  </section>
</body>
</html>
