<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playback speed</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script src="./buttons.js" defer></script><script src="./preview.js" defer></script><script src="./example.js" defer></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f4f2;font-family:"Instrument Sans",sans-serif}body.embedded{background:transparent}.sl-slider{width:min(320px,calc(100vw - 40px))}.sl-slider--vertical{width:min(178px,calc(100vw - 40px))}</style></head><body><div class="sl-slider slider-speed" data-slider="speed" data-format="percent"  data-labels="0.5×,1×,1.5×,2×,3×" style="--low:0%;--high:25%;--position:25%;--fraction:0.25;--zoom:0.01;--preview-value:1px"><div class="slider-header"><label for="next-speed">Speed</label><output for="next-speed" data-output>1×</output></div><div class="slider-track"><span class="slider-rail" aria-hidden="true"><span class="slider-fill"></span></span><input class="slider-input" id="next-speed" name="speed" type="range" min="0" max="4" step="1" value="1" ></div><div class="speed-stops" role="group" aria-label="Choose playback speed"><button type="button" data-step="0" aria-label="Set speed to 0.5×" aria-pressed="false">0.5×</button><button type="button" data-step="1" aria-label="Set speed to 1×" aria-pressed="true" class="is-current">1×</button><button type="button" data-step="2" aria-label="Set speed to 1.5×" aria-pressed="false">1.5×</button><button type="button" data-step="3" aria-label="Set speed to 2×" aria-pressed="false">2×</button><button type="button" data-step="4" aria-label="Set speed to 3×" aria-pressed="false">3×</button></div></div></body></html>
