<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donut chart — SL UI Library</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script src="./buttons.js" defer></script><script src="./example.js" defer></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#efefef;padding:20px;box-sizing:border-box}.dd-demo{width:min(320px,100%);container-type:inline-size}</style></head><body><div class="dd-demo" data-display="donut" tabindex="-1"><div class="dd-scene"><section class="dd-card dd-card--donut" aria-label="Donut chart"><div class="dd-head"><h3>Storage breakdown</h3><span class="dd-pill">100 GB</span></div><div class="dd-donut-layout"><div class="dd-donut"><svg viewBox="0 0 120 120" role="img" aria-label="Storage: Assets 42 GB, Documents 18 GB, Exports 12 GB, Free 28 GB"><circle class="dd-donut-track" cx="60" cy="60" r="46"/><g transform="rotate(-90 60 60)"><circle class="dd-donut-arc dd-series-0" data-arc="0" cx="60" cy="60" r="46" pathLength="100" stroke-dasharray="42 58" stroke-dashoffset="0"/><circle class="dd-donut-arc dd-series-1" data-arc="1" cx="60" cy="60" r="46" pathLength="100" stroke-dasharray="18 82" stroke-dashoffset="-42"/><circle class="dd-donut-arc dd-series-2" data-arc="2" cx="60" cy="60" r="46" pathLength="100" stroke-dasharray="12 88" stroke-dashoffset="-60"/></g></svg><div class="dd-donut-value"><strong data-storage-number>72</strong><span data-storage-label>GB used</span></div></div><div class="dd-legend" role="group" aria-label="Storage categories"><button type="button" data-action="segment" data-value="0" aria-pressed="false"><i class="dd-series-0"></i><span>Assets</span><strong>42 GB</strong></button><button type="button" data-action="segment" data-value="1" aria-pressed="false"><i class="dd-series-1"></i><span>Documents</span><strong>18 GB</strong></button><button type="button" data-action="segment" data-value="2" aria-pressed="false"><i class="dd-series-2"></i><span>Exports</span><strong>12 GB</strong></button><button type="button" data-action="segment" data-value="3" aria-pressed="false"><i class="dd-series-3"></i><span>Free</span><strong>28 GB</strong></button></div></div><div class="dd-bottom"><button class="dd-button" type="button" data-action="total" >Show total</button></div></section></div><p class="dd-caption">Choose a category. Values add up to 100 GB.</p><span class="dd-sr" data-live role="status" aria-live="polite" aria-atomic="true"></span></div></body></html>
