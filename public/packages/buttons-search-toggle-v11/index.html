<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search reveal · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px 16px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-search-toggle" data-active="false" aria-label="Search reveal">
    <button class="motion-button" type="button" data-action aria-label="Open search" aria-expanded="false" aria-controls="local-search-panel">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><circle class="search-ring" cx="10" cy="10" r="5.5"/><path class="search-handle" d="m14.2 14.2 5.3 5.3"/></svg></span><span class="button-label" data-label>Search</span><span class="button-chevron" aria-hidden="true"><svg viewBox="0 0 16 16" focusable="false"><path d="m5 6 3 3 3-3"/></svg></span></span>
    </button>
    <div class="search-reveal" id="local-search-panel" data-panel aria-hidden="true">
      <div class="search-content">
        <label class="visually-hidden" for="local-search-input">Search sample projects</label>
        <div class="search-field">
          <svg class="field-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="4.5"/><path d="m12 12 4 4"/></svg>
          <input id="local-search-input" type="search" data-search placeholder="Search projects" autocomplete="off" spellcheck="false">
          <button class="clear-search" type="button" data-clear aria-label="Clear search"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4 4 12"/></svg></button>
        </div>
        <ul class="search-results" data-results aria-label="Search results"></ul>
      </div>
    </div>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Search is closed.</p>
  </section>
</body>
</html>
