<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick edit</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script type="module" src="./example.js"></script></head><body><div class="overlay-demo" data-overlay="quickedit" data-open="false" data-success="Renamed to {project} in this preview."><div class="overlay-launch"><button class="overlay-trigger" type="button" data-trigger aria-haspopup="dialog" aria-expanded="false" aria-controls="quick-editor"><i class="menu-glyph " data-icon="edit" aria-hidden="true"><svg viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true"><path d="m5 23 1.5-5.5L19 5a2.8 2.8 0 0 1 4 4L10.5 21.5 5 23ZM16.5 7.5l4 4M6.5 17.5l4 4"/></svg></i><span>Rename project</span></button><p class="overlay-feedback" data-feedback role="status">Try it here. Nothing leaves this preview.</p></div><section class="overlay-panel" role="dialog" id="quick-editor" aria-labelledby="panel-title" aria-hidden="true" inert><button class="overlay-close" type="button" data-close aria-label="Close"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="m8 8 12 12M20 8 8 20"/></svg></button><div class="overlay-eyebrow">QUICK EDIT</div><h2 id="panel-title">A better name.</h2><form data-form><label class="overlay-field">Project name<input name="project" value="Studio project" required maxlength="48" autocomplete="off"></label><div class="overlay-actions"><button type="button" data-close>Cancel</button><button class="overlay-primary" type="submit">Save name</button></div></form></section></div></body></html>
