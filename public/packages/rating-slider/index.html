<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rating scale</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script src="./buttons.js" defer></script><script src="./preview.js" defer></script><script src="./example.js" defer></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f4f2;font-family:"Instrument Sans",sans-serif}body.embedded{background:transparent}.sl-slider{width:min(320px,calc(100vw - 40px))}.sl-slider--vertical{width:min(178px,calc(100vw - 40px))}</style></head><body><div class="sl-slider slider-rating" data-slider="rating" data-format="rating"   style="--low:0%;--high:50%;--position:50%;--fraction:0.5;--zoom:0.03;--preview-value:3px"><div class="slider-header"><label for="next-rating">Rating</label><output for="next-rating" data-output>3 / 5</output></div><div class="rating-stars" role="radiogroup" aria-label="Choose a rating"><button type="button" class="rating-choice" data-rating="1" role="radio" aria-label="1 star" aria-checked="false" tabindex="-1"><svg class="rating-star is-filled" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="--star-fill:1"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/><path class="star-solid" d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></button><button type="button" class="rating-choice" data-rating="2" role="radio" aria-label="2 stars" aria-checked="false" tabindex="-1"><svg class="rating-star is-filled" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="--star-fill:1"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/><path class="star-solid" d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></button><button type="button" class="rating-choice" data-rating="3" role="radio" aria-label="3 stars" aria-checked="true" tabindex="0"><svg class="rating-star is-filled" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="--star-fill:1"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/><path class="star-solid" d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></button><button type="button" class="rating-choice" data-rating="4" role="radio" aria-label="4 stars" aria-checked="false" tabindex="-1"><svg class="rating-star" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="--star-fill:0"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/><path class="star-solid" d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></button><button type="button" class="rating-choice" data-rating="5" role="radio" aria-label="5 stars" aria-checked="false" tabindex="-1"><svg class="rating-star" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="--star-fill:0"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/><path class="star-solid" d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></button></div><div class="slider-track"><span class="slider-rail" aria-hidden="true"><span class="slider-fill"></span></span><input class="slider-input" id="next-rating" name="rating" type="range" min="1" max="5" step="0.1" value="3" ></div><div class="slider-ends"><span>1 star</span><span>5 stars</span></div></div></body></html>
