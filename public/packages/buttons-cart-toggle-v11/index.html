<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart item · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-cart-toggle" data-state="empty" data-active="false" aria-label="Cart item">
    <button class="motion-button" type="button" data-action aria-label="Add item to cart" title="Add item to cart" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><path class="bag-body" d="M5 8.5h14l-1 12H6z"/><path class="bag-handle" d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2"/><rect class="bag-item" x="2.5" y="3" width="6" height="6" rx="1.7"/><path class="bag-plus" d="M5.5 4.5v3m-1.5-1.5h3"/><circle class="bag-count" cx="18.5" cy="5.5" r="3"/><path class="bag-one" d="M18.5 4v3"/></svg></span><span class="button-label" data-label>Add to cart</span></span>
    </button>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Item is not in the cart.</p>
  </section>
</body>
</html>
