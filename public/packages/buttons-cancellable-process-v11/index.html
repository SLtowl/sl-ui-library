<html lang="en">
<head>

  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #f5f4f2; }</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-cancellable-process" data-phase="idle" aria-label="Cancellable processing" aria-busy="false">
    <p class="ab-eyebrow">Workspace action</p>
    <h2>Prepare assets</h2>
    <p class="ab-description">Optimize the selected assets.</p>
    <div class="ab-actions"><button type="button" class="ab-primary ab-wide" data-run><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 5h14v14H5zM9 9h6M9 13h6M9 16h3"/></svg><span data-label>Prepare assets</span></button><button type="button" class="ab-quiet ab-wide" data-cancel hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"/></svg>Cancel processing</button></div>
<div class="ab-meta"><span data-stage>Ready to process</span><span class="ab-value" data-value>0%</span></div><div class="ab-track" role="progressbar" aria-label="Asset preparation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-progress><span class="ab-fill" data-fill></span></div>
    <p class="ab-status" data-status role="status" aria-live="polite" aria-atomic="true">Progress comes from your action.</p>
    <p class="ab-note" data-note>Connect onProcess to prepare assets.</p>
  </section>
</body>
