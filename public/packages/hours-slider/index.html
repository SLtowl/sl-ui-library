<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time window</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script src="./buttons.js" defer></script><script src="./preview.js" defer></script><script src="./example.js" defer></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f4f2;font-family:"Instrument Sans",sans-serif}body.embedded{background:transparent}.sl-slider{width:min(320px,calc(100vw - 40px))}.sl-slider--vertical{width:min(178px,calc(100vw - 40px))}</style></head><body><fieldset class="sl-slider sl-slider--range slider-hours" data-slider="hours" data-format="hours" style="--low:37.5%;--high:75%;--position:37.5%;--fraction:0.375;--zoom:0.09;--preview-value:9px"><legend class="slider-sr">Time window</legend><div class="slider-header"><span>Time window</span><output for="next-hours-min next-hours-max" data-output>09:00 – 18:00</output></div><div class="slider-track slider-track--dual"><span class="slider-rail" aria-hidden="true"><span class="slider-fill"></span></span><input class="slider-input" id="next-hours-min" name="hours-min" type="range" min="0" max="24" step="1" value="9" aria-label="Start time" data-low><input class="slider-input" id="next-hours-max" name="hours-max" type="range" min="0" max="24" step="1" value="18" aria-label="End time" data-high></div><div class="hour-marks" aria-hidden="true"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div></fieldset></body></html>
