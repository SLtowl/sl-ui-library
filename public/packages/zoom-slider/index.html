<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zoom</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script src="./buttons.js" defer></script><script src="./preview.js" defer></script><script src="./example.js" defer></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f4f2;font-family:"Instrument Sans",sans-serif}body.embedded{background:transparent}.sl-slider{width:min(320px,calc(100vw - 40px))}.sl-slider--vertical{width:min(178px,calc(100vw - 40px))}</style></head><body><div class="sl-slider slider-zoom" data-slider="zoom" data-format="percent"   style="--low:0%;--high:33.33333333333333%;--position:33.33333333333333%;--fraction:0.33333333333333326;--zoom:1;--preview-value:100px"><div class="slider-header"><label for="next-zoom">Zoom</label><output for="next-zoom" data-output>100%</output></div><div class="zoom-preview" aria-hidden="true"><span class="zoom-frame"></span></div><div class="slider-track"><span class="slider-rail" aria-hidden="true"><span class="slider-fill"></span></span><input class="slider-input" id="next-zoom" name="zoom" type="range" min="50" max="200" step="5" value="100" ></div><div class="slider-ends"><span>50%</span><span>200%</span></div></div></body></html>
