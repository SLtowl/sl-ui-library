<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Details disclosure · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px 16px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-details-disclosure" data-active="false" aria-label="Details disclosure">
    <button class="motion-button" type="button" data-action aria-label="Show details" aria-expanded="false" aria-controls="details-panel">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><path class="disclosure-chevron" d="m7 9 5 5 5-5"/></svg></span><span class="button-label" data-label>Show details</span></span>
    </button>
    <div class="details-panel" id="details-panel" data-panel data-open="false" aria-hidden="true" inert><div><p>Updated today · 3 collaborators · local example</p></div></div><p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Details are hidden.</p>
  </section>
</body>
</html>
