<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyboard shortcut guide</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script defer src="./buttons.js"></script><script defer src="./example.js"></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;padding:12px;box-sizing:border-box;background:#ededed}</style></head>
<body><div class="sl-component" data-kind="overlays-shortcut-guide-v11" data-open="false">
  <div class="ov-launch" data-launch><p class="ov-context">Workspace reference</p><button class="ov-trigger" type="button" data-trigger aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M7 10h1m3 0h1m3 0h2M7 14h1m3 0h6"/></svg><span>Keyboard shortcuts</span></button><p class="ov-summary" data-summary role="status">Find a shortcut by name or key</p><p class="ov-hint">Interactive local example</p></div>
  <div class="ov-layer" data-layer aria-hidden="true" inert><div class="ov-backdrop" data-backdrop aria-hidden="true"></div><section class="ov-panel" data-panel tabindex="-1" role="dialog" aria-label="Keyboard shortcut guide"><header class="ov-head"><div><p class="ov-kicker" data-count role="status">5 shortcuts</p><h2>Keyboard shortcuts</h2></div><button class="ov-close" type="button" data-close aria-label="Close keyboard shortcut guide"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 7 10 10M17 7 7 17"/></svg></button></header><div class="ov-body"><div class="ov-stack"><label class="ov-field"><span>Search shortcuts</span><input name="query" type="search" placeholder="Try search or Esc" autocomplete="off"></label><div class="ov-options" role="group" aria-label="Keyboard platform"><button type="button" data-platform="windows" aria-pressed="true">Windows</button><button type="button" data-platform="mac" aria-pressed="false">Mac</button></div></div><ul class="ov-list"><li class="ov-row ov-line" data-shortcut="0"><span>Search workspace</span><kbd>Ctrl + K</kbd></li><li class="ov-row ov-line" data-shortcut="1"><span>New note</span><kbd>Ctrl + N</kbd></li><li class="ov-row ov-line" data-shortcut="2"><span>Undo edit</span><kbd>Ctrl + Z</kbd></li><li class="ov-row ov-line" data-shortcut="3"><span>Close overlay</span><kbd>Esc</kbd></li><li class="ov-row ov-line" data-shortcut="4"><span>Next field</span><kbd>Tab</kbd></li></ul><p class="ov-note" data-empty hidden>No shortcuts match. Try another term.</p></div><footer class="ov-foot"><button type="button" data-action="clear">Clear search</button><button type="button" data-action="cancel" class="ov-primary">Done</button></footer></section></div>
