<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mirror item · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-mirror-item" data-state="normal" data-layout="compact" aria-label="Mirror item">
    <div class="editor-shell"><div class="tool-row" role="toolbar" aria-label="Mirror item tools"><button class="motion-button" type="button" data-action aria-label="Mirror item horizontally" title="Mirror item horizontally" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><path class="mirror-axis" d="M12 4v16"/><path class="mirror-left" d="M9 7 4.5 12 9 17Z"/><path class="mirror-right" d="M15 7 19.5 12 15 17Z"/></svg></span><span class="button-label" data-label>Mirror</span></span>
    </button></div><div class="sample-window" data-preview aria-hidden="true"><svg class="sample-picture" viewBox="0 0 58 42" focusable="false"><rect x="1" y="1" width="56" height="40" rx="6"/><circle cx="15" cy="13" r="4"/><path d="m7 34 13-12 8 7 7-6 16 11"/></svg></div></div>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Item is not mirrored.</p>
  </section>
</body>
</html>
