<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Mirror item · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>

<body>
  <section class="sl-component" data-kind="buttons-mirror-item" data-state="normal" aria-label="Mirror item">
    <div class="sample-window" data-preview aria-hidden="true"><div class="sample-flag"><i></i></div></div>
    <button class="motion-button" type="button" data-action aria-label="Mirror item horizontally" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><path class="mirror-axis" d="M12 4v16"/><path class="mirror-left" d="m9 7-4 5 4 5"/><path class="mirror-right" d="m15 7 4 5-4 5"/></svg></span><span class="button-label" data-label>Mirror</span></span>
    </button>

  </section>
</body>
</html>
