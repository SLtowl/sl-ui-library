<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule item · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-schedule-toggle" data-state="clear" data-active="false" aria-label="Schedule item">
    <div class="sample-window" data-preview aria-hidden="true"><div class="schedule-sample"><span class="sample-calendar"><b>18</b><i></i></span><em>September</em></div></div>
    <button class="motion-button" type="button" data-action aria-label="Schedule item" title="Schedule item" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><rect class="calendar-frame" x="4" y="5.5" width="16" height="14" rx="3"/><path d="M4 9.5h16M8 3.5v4m8-4v4"/><circle class="calendar-dot" cx="12" cy="14" r="2.2"/></svg></span><span class="button-label" data-label>Schedule</span></span>
    </button>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">No date is selected.</p>
  </section>
</body>
</html>
