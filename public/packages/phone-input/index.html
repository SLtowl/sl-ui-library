<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Matte Phone input</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./preview.js" defer></script>
  <script src="./example.js" defer></script>
  <style>
    body { margin: 0; min-height: 100svh; padding: 24px; box-sizing: border-box; display: grid; place-content: center; background: #f5f4f2; font-family: 'Instrument Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    body.embedded { background: transparent; }
    .example-note { position: fixed; bottom: 14px; inset-inline: 16px; margin: 0; color: #515555; font-size: 12px; line-height: 1.5; text-align: center; }
    .embedded .example-note { display: none; }
  </style>
</head>
<body>
  <div class="sl-field sl-field--phone" id="phone-field">
            <div class="sl-field__control">
              <svg class="sl-field__leading sl-field__phone" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path class="sl-field__phone-body" d="M8.3 5.8 11 9.9l-2.1 2c1.2 2.7 3.3 4.8 6 6l2-2.1 4.2 2.7-.9 3c-.3 1-1.3 1.7-2.4 1.5C10.7 21.9 5.1 16.3 4 9.2c-.2-1.1.5-2.1 1.5-2.4l2.8-1Z"/><path class="sl-field__phone-ring sl-field__phone-ring--one" d="M17.2 5.5c2.7.6 4.7 2.6 5.3 5.3"/><path class="sl-field__phone-ring sl-field__phone-ring--two" d="M17.7 1.9c4.2.8 7.5 4.2 8.4 8.4"/></svg>
              <input class="sl-field__input" id="demo-phone" type="tel" placeholder=" " autocomplete="tel" inputmode="tel" maxlength="20" aria-describedby="phone-help">
              <label class="sl-field__label" for="demo-phone">Phone number</label>
            </div>
            <p class="sl-field__helper" id="phone-help">Formatted as +1 (415) 555-0132 while you type.</p>
          </div>
  <p class="example-note">Formats a local preview only. It does not call or store the number.</p>
</body>
</html>
