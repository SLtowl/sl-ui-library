<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Key–value input — SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f5f4f2; }</style>
</head>
<body>
  <section class="sl-component" data-kind="inputs-key-value-v11" aria-label="Key–value input">
    <h2 class="sl-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3m8-16h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 9h4m-4 6h4"/></svg>Key–value input</h2>
    <div class="sl-pairs" role="group" aria-label="Metadata pairs"><div class="sl-pair"><label><span>Key 1</span><input type="text" value="team" data-key maxlength="32" aria-describedby="pairs-help"></label><label><span>Value 1</span><input type="text" value="Design" data-value maxlength="80" aria-describedby="pairs-help"></label><button type="button" data-remove aria-label="Remove pair 1">×</button></div></div>
    <div class="sl-actions"><button class="sl-add-pair" type="button">Add pair</button><span class="sl-count">1 / 3</span></div>
    <p class="sl-status" id="pairs-help" role="status">Keys must be unique. Values can be empty.</p>
  </section>
</body>
</html>
