<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #f5f4f2; }</style>
</head>
<body>
  <div class="pb pb-f pb-password pw" data-phase="idle">
    <div class="pw-plate">
      <div class="pw-clip pw-shade-clip" aria-hidden="true"><div class="pw-shade"></div></div>
      <div class="pw-clip" aria-hidden="true"><div class="pw-sheet"></div></div>
      <div class="pw-head"><div class="pw-well">
        <span class="pw-ring" aria-hidden="true"></span>
        <input type="password" aria-label="Password" autocomplete="new-password" spellcheck="false" placeholder="Create a password">
        <svg class="pw-ok" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="m5 12.5 4.5 4.5L19 7.5"/></svg>
        <button class="pw-show" type="button" aria-pressed="false" aria-label="Show password"><svg class="morph" viewBox="0 0 24 24" aria-hidden="true"><path class="a"/><path class="b"/><circle class="mid" cx="12" cy="12" r="1.8"/></svg></button>
      </div></div>
      <div class="pw-reveal"><ul class="pw-rules"></ul></div>
    </div>
    <span class="pb-sr" role="status" aria-live="polite"></span>
  </div>
</body>
</html>
