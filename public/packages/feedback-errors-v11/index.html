<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Form error summary — SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;background:#efefef;padding:28px 20px;box-sizing:border-box}</style>
</head>
<body>
  <div class="sl-component" data-kind="feedback-errors" data-state="idle">
    <section class="fb-panel" aria-label="Form error summary">
      <div class="fb-head">
        <span class="fb-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 3H5v18h14V7l-4-4H8m6 0v5h5M8 12h5m-5 4h3"/><path d="M16 11v4m0 3h.01"/></svg></span>
        <div><p class="fb-eyebrow">Workspace feedback</p><h2>Check your details</h2></div>
      </div>
      <p class="fb-copy">Check the name and email format.</p>
      <ul class="fb-errors" data-errors></ul>
      <form novalidate>
        <label>Workspace name<input data-name autocomplete="organization" value="" placeholder="e.g. Alex" maxlength="60" aria-invalid="false" aria-label="Workspace name"></label>
        <label>Contact email<input data-email type="email" autocomplete="email" value="" placeholder="alex@example.com" aria-invalid="false" aria-label="Contact email"></label>
        <div class="fb-actions">
          <button class="fb-primary" type="submit"><span data-check-icon hidden aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="m5 12 4 4L19 6"/></svg></span><span data-check-label>Check details</span></button>
        </div>
      </form>
      <p class="fb-status" data-status role="status" aria-live="polite" aria-atomic="true">Enter both fields, then check.</p>
    </section>
    <div class="fb-demo"><p data-caption>Local demo · no server requests.</p></div>
  </div>
</body>
</html>
