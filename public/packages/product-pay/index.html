<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pay · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #f5f4f2; }</style>
</head>
<body>
  <div class="pb pb-pay" data-state="idle" data-amount="49" data-currency="$">
    <button class="pb-btn" type="button">
      <span class="pb-fill" aria-hidden="true"></span>
      <span class="pb-t" data-label="idle">Pay $49</span>
      <span class="pb-t" data-label="amount" aria-hidden="true">$49.00</span>
      <span class="pb-t" data-label="done" aria-hidden="true">Paid</span>
      <span class="pb-t" data-label="fail" aria-hidden="true">Card declined</span>
    </button>
    <span class="pb-sr" data-status role="status" aria-live="polite"></span>
  </div>
</body>
</html>
