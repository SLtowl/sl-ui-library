<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distance bubble</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script src="./buttons.js" defer></script><script src="./preview.js" defer></script><script src="./example.js" defer></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f4f2;font-family:"Instrument Sans",sans-serif}body.embedded{background:transparent}.sl-slider{width:min(320px,calc(100vw - 40px))}.sl-slider--vertical{width:min(178px,calc(100vw - 40px))}</style></head><body><div class="sl-slider slider-distance" data-slider="distance" data-format="distance"   style="--low:0%;--high:35%;--position:35%;--fraction:0.35;--zoom:0.35;--preview-value:35px"><div class="slider-header"><label for="next-distance">Search radius</label><output for="next-distance" data-output>35 km</output></div><div class="slider-track"><span class="slider-rail" aria-hidden="true"><span class="slider-fill"></span></span><input class="slider-input" id="next-distance" name="distance" type="range" min="0" max="100" step="1" value="35" ><span class="distance-bubble" data-bubble aria-hidden="true">35 km</span></div><div class="slider-ends"><span>Nearby</span><span>100 km</span></div></div></body></html>
