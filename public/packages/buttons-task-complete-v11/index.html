<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complete task · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-task-complete" data-state="open" data-active="false" aria-label="Complete task">
    <div class="sample-window" data-preview aria-hidden="true"><div class="task-sample"><i></i><span>Review notes</span></div></div>
    <button class="motion-button" type="button" data-action aria-label="Mark task as done" title="Mark task as done" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><circle class="task-ring" cx="12" cy="12" r="8"/><path class="task-check" pathLength="1" d="m8 12 2.6 2.7L16.5 9"/></svg></span><span class="button-label" data-label>Mark done</span></span>
    </button>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Task is open.</p>
  </section>
</body>
</html>
