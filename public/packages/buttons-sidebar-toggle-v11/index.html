  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px 16px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>

<body>
  <section class="sl-component" data-kind="buttons-sidebar-toggle" data-active="false" aria-label="Sidebar toggle">

      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><rect class="sidebar-frame" x="3.5" y="4.5" width="17" height="15" rx="2"/><path class="sidebar-divider" d="M9 5v14"/><path class="sidebar-panel" d="M5.5 7h1.5v10H5.5"/></svg></span><span class="button-label" data-label>Open panel</span></span>
    </button>

  </section>
