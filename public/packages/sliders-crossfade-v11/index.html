<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Source crossfade</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{box-sizing:border-box;margin:0;padding:24px;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;background:#f5f4f2}</style>
</head>
<body>
  <section class="sl-component" data-kind="sliders-crossfade-v11" aria-label="Source crossfade">
    <h2 class="sl-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7m5 0h6M3 17h12m5 0h1"/><rect x="10" y="3.5" width="5" height="7" rx="1.5"/><rect x="15" y="13.5" width="5" height="7" rx="1.5"/></svg>Source crossfade</h2>
    <p class="sl-context">Mix · two sources</p>
    <div class="sl-sources"><div><span>Source A</span><strong data-a>0.707×</strong><small data-adb>−3.0 dB</small><i><b data-meter-a></b></i></div><div><span>Source B</span><strong data-b>0.707×</strong><small data-bdb>−3.0 dB</small><i><b data-meter-b></b></i></div></div>
    <label class="sl-field"><span class="sl-label"><span>Mix toward source B</span><span class="sl-value" data-value="0" aria-hidden="true">50 %</span></span><span class="sl-track" data-track="0" style="--fill:50%"><input type="range" name="crossfade-0" min="0" max="100" step="1" value="50" aria-label="Mix toward source B" aria-valuetext="50 %"></span></label>
    <p class="sl-summary" data-summary>Equal power · A² + B² = 1.00</p>
    <p class="sl-hint">Amplitude preview · no audio is played.</p>
    <div class="sl-actions"><button type="button" data-action="curve" aria-pressed="true">Equal power</button><button type="button" data-action="center">Center</button></div>
  </section>
</body>
</html>
