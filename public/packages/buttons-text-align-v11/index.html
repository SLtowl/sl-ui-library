<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text alignment · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-text-align" data-state="left" aria-label="Text alignment">
    <div class="sample-window" data-preview aria-hidden="true"><div class="sample-lines"><i></i><i></i><i></i></div></div>
    <button class="motion-button" type="button" data-action aria-label="Align text to the center">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><path class="align-line line-a" d="M4 6h16"/><path class="align-line line-b" d="M4 10h11"/><path class="align-line line-c" d="M4 14h16"/><path class="align-line line-d" d="M4 18h8"/></svg></span><span class="button-label" data-label>Align center</span></span>
    </button>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Text is aligned left.</p>
  </section>
</body>
</html>
