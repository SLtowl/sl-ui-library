<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare items · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-compare-toggle" data-state="stacked" data-active="false" aria-label="Compare items">
    <div class="sample-window" data-preview aria-hidden="true"><div class="compare-scene"><svg class="compare-connector" viewBox="0 0 120 56" focusable="false"><path pathLength="1" d="M45 28H75"/><circle cx="45" cy="28" r="1.8"/><circle cx="75" cy="28" r="1.8"/></svg><span class="compare-card card-a"><i></i><b></b></span><span class="compare-card card-b"><i></i><b></b></span></div></div>
    <button class="motion-button" type="button" data-action aria-label="Separate items for comparison" title="Separate items for comparison" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><rect class="compare-a" x="5" y="5" width="9" height="14" rx="2"/><rect class="compare-b" x="10" y="5" width="9" height="14" rx="2"/><path class="compare-link" pathLength="1" d="M9 12h6"/></svg></span><span class="button-label" data-label>Compare</span></span>
    </button>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Two items are stacked.</p>
  </section>
</body>
</html>
