<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound toggle · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px 16px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-sound-toggle" data-active="false" aria-label="Sound toggle">
    <button class="motion-button" type="button" data-action aria-label="Mute" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><path class="sound-speaker" d="M4 9h4l4-3v12l-4-3H4Z"/><path class="sound-wave wave-one" d="M15 9.2a4 4 0 0 1 0 5.6"/><path class="sound-wave wave-two" d="M17.8 6.5a7.5 7.5 0 0 1 0 11"/><path class="sound-slash" pathLength="1" d="M5 4 20 19"/></svg></span><span class="button-label" data-label>Mute</span></span>
    </button>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Sound is on.</p>
  </section>
</body>
</html>
