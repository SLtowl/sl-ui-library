<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grouped resource picker</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f5f4f2; padding: 24px; box-sizing: border-box; }</style>
</head>
<body>
  <div class="sl-component" data-kind="menus-resource-picker-v11" data-open="false">
    <p class="sl-eyebrow">Studio resources</p>
    <button class="sl-trigger" data-trigger type="button" aria-expanded="false" aria-haspopup="dialog"><svg class="" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><span data-label>Choose a resource</span><svg class="sl-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="m7 10 5 5 5-5"/></svg></button>
    <div class="sl-panel" data-panel tabindex="-1" role="dialog" aria-label="Grouped resource picker" aria-hidden="true" inert>
      <label class="sl-search"><svg class="" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input data-search type="search" aria-label="Search resources" placeholder="Search resources" autocomplete="off" spellcheck="false"></label><div class="sl-scroll"><section data-group><h3>Projects</h3><button class="sl-option" type="button" data-key="atlas" data-choice data-name="Atlas website" aria-pressed="false"><span><strong>Atlas website</strong><small>Project · 12 items</small></span><span class="sl-mark" aria-hidden="true">✓</span></button><button class="sl-option" type="button" data-key="field" data-choice data-name="Field notes" aria-pressed="false"><span><strong>Field notes</strong><small>Project · 8 items</small></span><span class="sl-mark" aria-hidden="true">✓</span></button></section><section data-group><h3>Documents</h3><button class="sl-option" type="button" data-key="brief" data-choice data-name="Release brief" aria-pressed="false"><span><strong>Release brief</strong><small>Document · Updated today</small></span><span class="sl-mark" aria-hidden="true">✓</span></button><button class="sl-option" type="button" data-key="guide" data-choice data-name="Writing guide" aria-pressed="false"><span><strong>Writing guide</strong><small>Document · 6 pages</small></span><span class="sl-mark" aria-hidden="true">✓</span></button></section><p data-empty class="sl-empty" hidden>No matching resources.</p></div>
    </div>
    <div class="sl-summary" role="region" aria-label="Local result" tabindex="0"><p><strong data-summary>No resource selected</strong></p><small>Search projects and documents together.</small></div>
    <p class="sl-feedback" data-feedback role="status" aria-live="polite">Choose a local resource to inspect.</p>
  </div>
</body>
</html>
