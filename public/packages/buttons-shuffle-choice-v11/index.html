<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shuffle and undo · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid;grid-template-columns:minmax(0,1fr); place-items: center; padding: 24px 16px; box-sizing: border-box; background: #f5f4f2; }</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-shuffle-choice" data-phase="idle" aria-label="Shuffle and undo" aria-busy="false">
    <p class="ab-eyebrow">Creative prompt</p>
    <h2>Pick a starting point</h2>
    <p class="ab-description">Try another direction for this draft.</p>
    <div class="ab-suggestion"><span class="ab-value" data-number>01 / 04</span><strong data-choice>Quiet geometry</strong><div class="shuffle-slots" aria-hidden="true"><span data-slot="0">01</span><span data-slot="1">02</span><span data-slot="2">03</span></div></div>
<div class="ab-actions"><button type="button" class="ab-primary" data-shuffle><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="shuffle-down" pathLength="1" d="M3 6h3c4 0 8 12 12 12h3m-4-4 4 4-4 4"/><path class="shuffle-up" pathLength="1" d="M3 18h3c4 0 8-12 12-12h3m-4-4 4 4-4 4"/></svg>Shuffle</button><button type="button" class="ab-quiet" data-undo disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10h10a6 6 0 0 1 0 12M4 10l5-5M4 10l5 5"/></svg>Undo</button></div>
    <p class="ab-status" data-status role="status" aria-live="polite" aria-atomic="true">A local suggestion, ready to explore.</p>
    <p class="ab-note" data-note>Local selection · no content is generated.</p>
  </section>
</body>
</html>
