<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini mixer</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script src="./buttons.js" defer></script><script src="./preview.js" defer></script><script src="./example.js" defer></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f4f2;font-family:"Instrument Sans",sans-serif}body.embedded{background:transparent}.sl-slider{width:min(320px,calc(100vw - 40px))}.sl-slider--vertical{width:min(178px,calc(100vw - 40px))}</style></head><body><fieldset class="mixer-group"><legend class="slider-sr">Audio mixer</legend><p class="mixer-title">Channel levels</p><div class="mixer-channels"><div class="sl-slider sl-slider--vertical slider-channel" data-slider="voice" data-format="percent"   style="--low:0%;--high:72%;--position:72%;--fraction:0.72"><div class="slider-header"><label for="next-voice">Voice</label><output for="next-voice" data-output>72%</output></div><div class="slider-track"><span class="slider-rail" aria-hidden="true"><span class="slider-fill"></span></span><input class="slider-input" id="next-voice" name="voice" type="range" min="0" max="100" step="1" value="72" aria-orientation="vertical"></div><div class="slider-ends"><span>0</span><span>100</span></div></div><div class="sl-slider sl-slider--vertical slider-channel" data-slider="music" data-format="percent"   style="--low:0%;--high:48%;--position:48%;--fraction:0.48"><div class="slider-header"><label for="next-music">Music</label><output for="next-music" data-output>48%</output></div><div class="slider-track"><span class="slider-rail" aria-hidden="true"><span class="slider-fill"></span></span><input class="slider-input" id="next-music" name="music" type="range" min="0" max="100" step="1" value="48" aria-orientation="vertical"></div><div class="slider-ends"><span>0</span><span>100</span></div></div><div class="sl-slider sl-slider--vertical slider-channel" data-slider="effects" data-format="percent"   style="--low:0%;--high:32%;--position:32%;--fraction:0.32"><div class="slider-header"><label for="next-effects">FX</label><output for="next-effects" data-output>32%</output></div><div class="slider-track"><span class="slider-rail" aria-hidden="true"><span class="slider-fill"></span></span><input class="slider-input" id="next-effects" name="effects" type="range" min="0" max="100" step="1" value="32" aria-orientation="vertical"></div><div class="slider-ends"><span>0</span><span>100</span></div></div></div></fieldset></body></html>
