  <style>body { margin: 0; min-height: 100svh; display: grid;grid-template-columns:minmax(0,1fr); place-items: center; padding: 24px 16px; box-sizing: border-box; background: #f5f4f2; }</style>

<body>
  <section class="sl-component" data-kind="buttons-hold-confirm" data-phase="idle" aria-label="Hold to confirm" aria-busy="false">
    <p class="ab-eyebrow">Deliberate action</p>
    <h2>Archive draft</h2>
    <p class="ab-description">Move this draft out of the active list.</p>
    <div class="ab-actions"><button type="button" class="ab-wide ab-hold" data-hold><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 8h12v12H6zM4 4h16v4H4zM10 12h4"/><path class="ab-hold-stroke" data-hold-stroke pathLength="100" d="M6 8h12v12H6zM4 4h16v4H4zM10 12h4"/></svg><span data-label>Hold to archive</span><span class="ab-hold-fill" data-fill aria-hidden="true"></span></button></div>
<button type="button" class="ab-quiet ab-wide" data-cancel hidden>Cancel action</button>
    <p class="ab-status" data-status role="status" aria-live="polite" aria-atomic="true">Hold for 1.2 seconds using pointer, Space or Enter.</p>
    <p class="ab-note" data-note>Connect onConfirm to archive the draft.</p>
  </section>
</body>
