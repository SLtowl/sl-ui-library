<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power control · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-power-toggle" data-state="off" data-active="false" aria-label="Power control">
    <button class="motion-button" type="button" data-action aria-label="Turn the local control on" title="Turn the local control on" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><rect class="power-track" x="2.5" y="6.5" width="19" height="11" rx="5.5"/><circle class="power-knob" data-probe cx="8" cy="12" r="3.1"/></svg></span><span class="button-label" data-label>Turn on</span></span>
    </button>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Control is off.</p>
  </section>
</body>
</html>
