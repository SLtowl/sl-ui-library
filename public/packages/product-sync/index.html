<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sync · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #f5f4f2; }</style>
</head>
<body>
  <div class="pb pb-f pb-sync sr" data-sync="done">
    <button class="sr-row" type="button" role="switch" aria-checked="true" aria-label="Sync">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.3L4 8.5M4 4v4.5h4.5M4 13a8 8 0 0 0 14.3 4.3l1.7-1.8M20 20v-4.5h-4.5"/></svg>
      <span class="sr-label">Sync</span>
      <span class="sr-status"><span data-s="paused">Paused</span><span data-s="busy">Syncing</span><span data-s="done">Up to date</span></span>
      <span class="sr-sw" aria-hidden="true"></span>
    </button>
  </div>
</body>
</html>
