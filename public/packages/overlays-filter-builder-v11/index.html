<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project filter overlay</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script defer src="./buttons.js"></script><script defer src="./example.js"></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;padding:12px;box-sizing:border-box;background:#ededed}</style></head>
<body><div class="sl-component" data-kind="overlays-filter-builder-v11" data-open="false">
  <div class="ov-launch" data-launch><p class="ov-context">Project list</p><button class="ov-trigger" type="button" data-trigger aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16l-6 7v6l-4 2v-8L4 5Z"/></svg><span>Filter projects</span></button><p class="ov-summary" data-summary role="status">4 projects · no filters</p><p class="ov-hint">Interactive local example</p></div>
  <div class="ov-layer" data-layer aria-hidden="true" inert><div class="ov-backdrop" data-backdrop aria-hidden="true"></div><section class="ov-panel" data-panel tabindex="-1" role="dialog" aria-label="Project filter overlay"><header class="ov-head"><div><p class="ov-kicker">Filter</p><h2>Narrow the list</h2></div><button class="ov-close" type="button" data-close aria-label="Close project filter overlay"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 7 10 10M17 7 7 17"/></svg></button></header><div class="ov-body"><div class="ov-stack"><label class="ov-field"><span>Project title</span><input type="search" name="query" placeholder="Search project names" autocomplete="off"></label><label class="ov-field"><span>Status</span><span class="sl-choice"><select hidden name="status"><option value="all">Any status</option><option value="active">Active</option><option value="planned">Planned</option></select><button class="sl-choice-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Status"><span class="sl-choice-value">Any status</span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 10 5 5 5-5"/></svg></button><span class="sl-choice-list" role="listbox" aria-label="Status" aria-hidden="true" inert><button class="sl-choice-option" type="button" role="option" data-choice="all" aria-selected="false" tabindex="-1">Any status</button><button class="sl-choice-option" type="button" role="option" data-choice="active" aria-selected="false" tabindex="-1">Active</button><button class="sl-choice-option" type="button" role="option" data-choice="planned" aria-selected="false" tabindex="-1">Planned</button></span></span></label><label class="ov-check"><input type="checkbox" name="mine"><span>Only projects I own</span></label><div class="ov-note"><strong data-match-count>4 matching projects</strong><ul class="ov-list" data-matches><li>Studio website</li><li>Field notes</li><li>Mobile kit</li><li>Archive index</li></ul></div></div></div><footer class="ov-foot"><button type="button" data-action="clear">Clear filters</button><button type="button" data-action="apply" class="ov-primary">Show 4</button></footer></section></div>
</div></body></html>
