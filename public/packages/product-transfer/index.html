<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transfer · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #f5f4f2; }</style>
</head>
<body>
  <div class="pb pb-f pb-transfer am" data-sheet="closed">
    <div class="am-plate">
      <div class="am-clip am-shade-clip" aria-hidden="true"><div class="am-shade"></div></div>
      <div class="am-clip" aria-hidden="true"><div class="am-sheet"></div></div>
      <div class="am-head">
        <div class="am-well cur"><span class="am-ring" aria-hidden="true"></span><button class="am-cur" type="button" aria-haspopup="listbox" aria-controls="pb-transfer-list" aria-expanded="false"></button></div>
        <label class="am-well num"><span class="am-ring" aria-hidden="true"></span><span class="am-meter" aria-hidden="true"><i></i></span><input type="text" inputmode="decimal" aria-label="Amount to send" autocomplete="off" spellcheck="false" placeholder="Amount to send" data-bwignore="true" data-1p-ignore="true" data-lpignore="true" data-form-type="other"><button class="am-max" type="button">Max</button><span class="am-note" aria-hidden="true">Over limit</span></label>
      </div>
      <div class="am-reveal"><div class="am-list" id="pb-transfer-list" role="listbox" aria-label="Currencies"><span class="am-knob" aria-hidden="true"></span></div></div>
    </div>
    <span class="pb-sr" role="status" aria-live="polite"></span>
  </div>
</body>
</html>
