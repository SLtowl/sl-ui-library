<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dependent export options</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; padding: 24px 16px; display: grid; place-items: center; box-sizing: border-box; background: #f5f4f2; }</style>
</head>
<body>
  <form class="sl-component" data-kind="checkboxes-dependencies" aria-label="Dependent export options">
    <h2>Dependent export options</h2>
    <p class="choice-intro">Details need source files. Removing sources clears details.</p>

    <div class="choice-list"><label class="choice"><input data-choice type="checkbox" name="choices" value="sources" checked ><span class="choice-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path class="choice-tick" d="m5 12 4.5 4.5L19 7"/><path class="choice-dash" d="M6 12h12"/><circle class="choice-dot" cx="12" cy="12" r="4"/></svg></span><span class="choice-copy"><span class="choice-title">Source files</span><span class="choice-hint">Required for either detail option</span></span></label><div class="choice-dependent"><label class="choice"><input data-choice type="checkbox" name="choices" value="comments"  ><span class="choice-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path class="choice-tick" d="m5 12 4.5 4.5L19 7"/><path class="choice-dash" d="M6 12h12"/><circle class="choice-dot" cx="12" cy="12" r="4"/></svg></span><span class="choice-copy"><span class="choice-title">Comments</span><span class="choice-hint">Includes source files</span></span></label><label class="choice"><input data-choice type="checkbox" name="choices" value="history"  ><span class="choice-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path class="choice-tick" d="m5 12 4.5 4.5L19 7"/><path class="choice-dash" d="M6 12h12"/><circle class="choice-dot" cx="12" cy="12" r="4"/></svg></span><span class="choice-copy"><span class="choice-title">Change history</span><span class="choice-hint">Includes source files</span></span></label></div><label class="choice"><input data-choice type="checkbox" name="choices" value="readme"  ><span class="choice-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path class="choice-tick" d="m5 12 4.5 4.5L19 7"/><path class="choice-dash" d="M6 12h12"/><circle class="choice-dot" cx="12" cy="12" r="4"/></svg></span><span class="choice-copy"><span class="choice-title">Readme</span><span class="choice-hint">Independent of source files</span></span></label></div>

    <div class="choice-footer"><p class="choice-status" data-status role="status" aria-live="polite" aria-atomic="true">1 export option selected</p><button type="button" data-clear >Clear</button></div>
  </form>
</body>
</html>
