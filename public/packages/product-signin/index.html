<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email sign-in · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #f5f4f2; }</style>
</head>
<body>
  <form class="pb pb-f si pb-signin" data-state="email" novalidate>
    <div class="si-top">
      <label class="si-label" for="pb-signin-mail">Email</label>
      <span class="si-chip"></span>
      <button class="si-change" type="button" tabindex="-1">Change</button>
      <button class="si-resend" type="button" tabindex="-1" disabled>Resend</button>
    </div>
    <div class="si-box">
      <input class="si-input" id="pb-signin-mail" type="text" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="you@company.com" data-bwignore="true" data-1p-ignore="true" data-lpignore="true">
      <button class="si-go" type="submit" tabindex="-1"><span class="t go">Continue</span><span class="t dots" aria-hidden="true"><i></i><i></i><i></i></span></button>
      <div class="si-cells" role="group" aria-label="Code from the email">
        <input class="si-cell" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="Digit 1" tabindex="-1">
        <input class="si-cell" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 2" tabindex="-1">
        <input class="si-cell" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 3" tabindex="-1">
        <input class="si-cell" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 4" tabindex="-1">
        <input class="si-cell" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 5" tabindex="-1">
        <input class="si-cell" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 6" tabindex="-1">
        <span class="si-ring" aria-hidden="true"></span>
      </div>
      <span class="si-done" aria-hidden="true">Signed in</span>
    </div>
    <span class="pb-sr" data-status role="status" aria-live="polite"></span>
  </form>
</body>
</html>
