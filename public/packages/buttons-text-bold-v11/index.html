<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bold text · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-text-bold" data-state="regular" data-layout="compact" aria-label="Bold text">
    <div class="editor-shell"><div class="tool-row" role="toolbar" aria-label="Bold text tools"><button class="motion-button" type="button" data-action aria-label="Turn on bold text" title="Turn on bold text" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><path class="bold-stem" d="M7 4.5v15"/><path class="bold-bowl bold-top" d="M7 5h6a4 4 0 0 1 0 8H7"/><path class="bold-bowl bold-bottom" d="M7 12.5h6.7a3.5 3.5 0 0 1 0 7H7"/></svg></span><span class="button-label" data-label>Bold</span></span>
    </button></div><div class="sample-window" data-preview aria-hidden="true"><div class="sample-copy">Project notes</div></div></div>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Regular text.</p>
  </section>
</body>
</html>
