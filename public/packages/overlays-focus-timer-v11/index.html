<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus timer overlay</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script defer src="./buttons.js"></script><script defer src="./example.js"></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;padding:12px;box-sizing:border-box;background:#ededed}</style></head>
<body><div class="sl-component" data-kind="overlays-focus-timer-v11" data-open="false">
  <div class="ov-launch" data-launch><p class="ov-context">Local session</p><button class="ov-trigger" type="button" data-trigger aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="13" r="8"/><path d="M9 2h6m-3 0v3m0 8 3-3M19 5l2 2"/></svg><span>Open focus timer</span></button><p class="ov-summary" data-summary role="status" aria-live="off">5 minute session ready</p><p class="ov-hint">Interactive local example</p></div>

" data-action="restart">Restart</button><button type="button" data-action="toggle" class="ov-primary">Start</button></footer></section></div>
</div></body></html>
