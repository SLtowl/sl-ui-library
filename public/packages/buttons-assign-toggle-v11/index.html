<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assign person · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-assign-toggle" data-state="unassigned" data-active="false" aria-label="Assign person">
    <div class="sample-window" data-preview aria-hidden="true"><div class="assign-scene"><span class="assign-card"><i></i><b></b><em></em></span><span class="assign-link"></span><span class="assign-avatar"><svg viewBox="0 0 24 24" focusable="false"><g class="assign-person"><circle cx="12" cy="7.5" r="3.3"/><path d="M5 19.25c.7-3.8 3.25-5.7 7-5.7s6.3 1.9 7 5.7"/></g></svg></span></div></div>
    <button class="motion-button" type="button" data-action aria-label="Assign a person to the item" title="Assign a person to the item" aria-pressed="false">
      <span class="button-surface" aria-hidden="true"><span class="button-icon"><svg viewBox="0 0 24 24" focusable="false"><circle class="assign-head" cx="9" cy="7" r="3.3"/><path class="assign-body" d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path class="assign-plus" d="M18 9v6m-3-3h6"/><path class="assign-check" pathLength="1" d="m15.2 12.2 2 2 4-4"/></svg></span><span class="button-label" data-label>Assign person</span></span>
    </button>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">No person is assigned.</p>
  </section>
</body>
</html>
