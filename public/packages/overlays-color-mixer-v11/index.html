<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGB color mixer</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script defer src="./buttons.js"></script><script defer src="./example.js"></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;padding:12px;box-sizing:border-box;background:#ededed}</style></head>
<body><div class="sl-component" data-kind="overlays-color-mixer-v11" data-open="false">
  <div class="ov-launch" data-launch><p class="ov-context">Appearance token</p><button class="ov-trigger" type="button" data-trigger aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-12Z"/><path d="M8 15a4 4 0 0 0 4 4"/></svg><span>Mix a color</span></button><p class="ov-summary" data-summary role="status">#A8C0AE selected</p><p class="ov-hint">Interactive local example</p></div>
  <div class="ov-layer" data-layer aria-hidden="true" inert><div class="ov-backdrop" data-backdrop aria-hidden="true"></div><section class="ov-panel" data-panel tabindex="-1" role="dialog" aria-label="RGB color mixer"><header class="ov-head"><div><p class="ov-kicker">Color</p><h2>Mix a color</h2></div><button class="ov-close" type="button" data-close aria-label="Close rgb color mixer"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 7 10 10M17 7 7 17"/></svg></button></header><div class="ov-body"><div class="ov-swatch" data-swatch role="img" aria-label="Selected color #A8C0AE"></div><div class="ov-stack"><label class="ov-field"><span>Red · <output data-channel="r">168</output></span><input type="range" name="r" min="0" max="255" step="1" value="168"></label><label class="ov-field"><span>Green · <output data-channel="g">192</output></span><input type="range" name="g" min="0" max="255" step="1" value="192"></label><label class="ov-field"><span>Blue · <output data-channel="b">174</output></span><input type="range" name="b" min="0" max="255" step="1" value="174"></label><label class="ov-field"><span>Hex color</span><input name="hex" value="#A8C0AE" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex color, six hexadecimal digits"></label></div><p class="ov-status" data-color-status role="status">Six digits, with or without #.</p></div><footer class="ov-foot"><button type="button" data-action="cancel">Cancel</button><button type="button" data-action="apply" class="ov-primary">Use color</button></footer></section></div>
</div></body></html>
