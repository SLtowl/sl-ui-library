<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Version history overlay</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./buttons.css"><script defer src="./buttons.js"></script><script defer src="./example.js"></script><style>body{margin:0;min-height:100svh;display:grid;place-items:center;padding:12px;box-sizing:border-box;background:#ededed}</style></head>
<body><div class="sl-component" data-kind="overlays-version-history-v11" data-open="false">
  <div class="ov-launch" data-launch><p class="ov-context">Draft history</p><button class="ov-trigger" type="button" data-trigger aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6m2-3v6l4 2"/></svg><span>Review versions</span></button><p class="ov-summary" data-summary role="status">Current draft · Version 3</p><p class="ov-hint">Interactive local example</p></div>
  <div class="ov-layer" data-layer aria-hidden="true" inert><div class="ov-backdrop" data-backdrop aria-hidden="true"></div><section class="ov-panel" data-panel tabindex="-1" role="dialog" aria-label="Version history overlay"><header class="ov-head"><div><p class="ov-kicker">Local history</p><h2>Review a version</h2></div><button class="ov-close" type="button" data-close aria-label="Close version history overlay"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 7 10 10M17 7 7 17"/></svg></button></header><div class="ov-body"><div class="ov-history" role="group" aria-label="Available revisions"><button type="button" data-version="3" aria-pressed="true"><span>Version 3</span><span class="ov-muted">14:40</span></button><button type="button" data-version="2" aria-pressed="false"><span>Version 2</span><span class="ov-muted">12:10</span></button><button type="button" data-version="1" aria-pressed="false"><span>Version 1</span><span class="ov-muted">09:30</span></button></div><div class="ov-note ov-revision" data-revision>Build a useful workspace with clear navigation and thoughtful defaults.</div><p class="ov-status" data-history-status role="status">Viewing Version 3 · current draft</p><p class="ov-muted">Versions belong to this local example.</p></div><footer class="ov-foot"><button type="button" data-action="undo">Undo</button><button type="button" data-action="use" class="ov-primary">Use version</button></footer></section></div>
</div></body></html>
