<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image transform toolbar · SL UI Library</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./buttons.css">
  <script src="./buttons.js" defer></script>
  <script src="./example.js" defer></script>
  <style>body{margin:0;width:100%;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:8px;box-sizing:border-box;overflow-x:hidden;background:#f5f4f2}.sl-component{justify-self:center}</style>
</head>
<body>
  <section class="sl-component" data-kind="buttons-image-transform-toolbar" data-rotation="0" data-mirrored="false" aria-label="Image transform toolbar">
    <div class="editor-shell">
      <div class="tool-row" role="toolbar" aria-label="Image transform tools">
        <button class="tool-button" type="button" data-command="rotate" aria-label="Rotate image 90 degrees" title="Rotate 90 degrees" tabindex="0">
          <span class="tool-surface" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="rotate-arrow" d="M18.7 8.5A7.5 7.5 0 1 0 19 15m-.3-6.5V4.8m0 3.7H15"/><path class="rotate-corner" d="M8 9v7h7"/></svg></span>
        </button>
        <button class="tool-button" type="button" data-command="mirror" aria-label="Mirror image horizontally" title="Mirror horizontally" aria-pressed="false" tabindex="-1">
          <span class="tool-surface" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="mirror-axis" d="M12 4v16"/><path class="mirror-left" d="M9 7 4.5 12 9 17Z"/><path class="mirror-right" d="M15 7 19.5 12 15 17Z"/></svg></span>
        </button>
      </div>
      <div class="sample-window" data-preview aria-hidden="true">
        <svg class="sample-picture" viewBox="0 0 76 54" focusable="false"><rect x="1" y="1" width="74" height="52" rx="7"/><circle cx="20" cy="16" r="5"/><path d="m9 44 17-16 11 9 9-8 21 15"/></svg>
      </div>
    </div>
    <p class="component-status" data-status role="status" aria-live="polite" aria-atomic="true">Rotation: 0°. Original orientation.</p>
  </section>
</body>
</html>
