body{background:var(--page)}
#field{position:fixed;inset:0;z-index:0;width:100%;height:100%}
/* Title on the left; on the right, the catalog with two real components lifted off it. */
.split{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);align-items:center;gap:clamp(28px,4vw,72px);min-height:100dvh;padding:96px clamp(24px,5vw,88px) 48px;pointer-events:none}
.split>*{pointer-events:auto}
h1{margin:0;font-size:clamp(42px,5.2vw,80px);font-weight:600;line-height:1.02;letter-spacing:-.045em;text-wrap:balance}
.lead{margin:22px 0 34px;max-width:29em;font-size:clamp(16px,1.3vw,18.5px);line-height:1.55;color:var(--muted);text-wrap:pretty}
.go{display:flex;flex-wrap:wrap;gap:10px}
.go .btn{height:52px;padding:0 26px;border-radius:15px}
.go .btn-main{box-shadow:0 8px 20px -10px var(--accent)}
.scene{position:relative;justify-self:center;width:100%;max-width:860px}
/* The catalog in a plain window with a thin light bezel and a soft, deep shadow. */
.window{display:block;padding:7px;border-radius:24px;background:linear-gradient(var(--surface),var(--n3));box-shadow:0 0 0 1px var(--line-hi),inset 0 1px 0 #fff,0 2px 4px oklch(22% .016 260 / .06),0 24px 48px -16px oklch(22% .016 260 / .22),0 60px 100px -40px oklch(22% .016 260 / .28)}
.screen{display:block;overflow:hidden;border-radius:17px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.bar{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;background:var(--n2);box-shadow:inset 0 -1px 0 var(--line)}
.bar i{width:10px;height:10px;border-radius:50%;background:var(--n6)}
/* A still of the Buttons catalog, sized to the browser frame. */
.view{position:relative;display:block;overflow:hidden;aspect-ratio:1440/860;background:var(--n2)}
.view img{display:block;width:100%;height:auto}
/* Real components float in front of the window on their own, with only a soft shadow, and can be used right here. */
.float{position:absolute;transform:translate(var(--px,0),var(--py,0));transition:transform 1s var(--out)}
/* The two components are drawn at their own sizes (Wi-Fi text 15px, Copy text 19px). Wi-Fi is scaled to .93 and Copy to .9, so the button keeps its weight next to the card. */
.float-preview{display:grid;place-items:center;container-type:inline-size;width:var(--w);height:var(--h);transform:scale(var(--s));transform-origin:0 0}
.float{width:calc(var(--w) * var(--s));height:calc(var(--h) * var(--s))}
.float .copy-feedback{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#f1 .sl-toggle{width:300px}
.float .sl-copy:disabled{opacity:1}
@media(forced-colors:none){
  #f1 .sl-toggle{--toggle-ink:#f8f9fb;--toggle-hover:#f6f7f9;--toggle-track:#dbe0e5;--toggle-track-on:#687687;--toggle-thumb:#fff;--toggle-text:#34404e;--toggle-muted:#536474;box-shadow:inset 0 1px #ffffff0d,0 2px 5px #00000010,0 18px 26px #2b344733,0 2px 4px #2b344714}
  #f1 .sl-toggle__emblem{background:#f1f2f4;border-color:#dce0e5;color:#44505e}
  #f1 .sl-toggle[data-checked="true"] .sl-toggle__emblem{background:#f4f5f7;border-color:#e5e6e8;color:#374351}
  #f1 .sl-toggle[data-checked="true"] .sl-toggle__status{color:#3e4a58}
  #f1 .sl-toggle__track{border-color:#cbd1d8;box-shadow:inset 0 1px 2px #26374920}
  #f1 .sl-toggle__input:checked+.sl-toggle__track{border-color:#687687}
  #f1 .sl-toggle__thumb{border:1px solid #929ca8;color:#39434f;box-shadow:0 2px 4px #26374926,inset 0 1px #fff}
  #f1 .sl-toggle__input:focus-visible+.sl-toggle__track{outline-color:#2d6af6}
  #f2 .sl-copy{--copy-ink:#f8f9fb;--copy-hover:#f5f6f8;--copy-feedback:#f1f2f4;--copy-text:#333f4d;--copy-focus:#2d6af6}
  #f2 .sl-copy__surface{box-shadow:inset 0 1px #ffffff12,0 0 0 1px #bac7d5,0 18px 26px #2b344733,0 2px 4px #2b344714}
}
.f1{left:-6%;bottom:-6%;--w:340px;--h:110px;--s:.93}
.f2{right:-4%;top:-6%;--w:220px;--h:84px;--s:.9}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr);align-content:start;padding-top:104px}.scene{margin-top:28px}.f1{left:-2%}.f2{right:-2%}}
@media(max-width:560px){.float{display:none}}
/* The home page is for looking, not for selecting text. */
body{-webkit-user-select:none;user-select:none}
/* Browse components: the whole page zooms down and away, then the catalog builds itself in. */
/* A sharp dive: the page accelerates down and shrinks, like a camera dropping into the catalog. */
.split,.top,#field{transition:transform .42s cubic-bezier(.6,0,.85,.3),opacity .32s cubic-bezier(.6,0,.85,.3) .08s}
html.going .split{transform:translateY(16vh) scale(.78);opacity:0}
html.going .top{transform:translateY(-40px);opacity:0}
html.going #field{opacity:0}
@media(prefers-reduced-motion:reduce){.float{transform:none}}
