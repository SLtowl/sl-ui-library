<div class="pb pb-download" data-state="idle">
  <button class="pb-btn" type="button">
    <span class="pb-fill" aria-hidden="true"></span>
    <span class="pb-t" data-label="idle">Download</span>
    <span class="pb-t" data-label="pct" aria-hidden="true">0%</span>
    <span class="pb-t" data-label="cancel" aria-hidden="true">Cancel</span>
    <span class="pb-t" data-label="done" aria-hidden="true">Open file</span>
  </button>
  <span class="pb-sr" data-status role="status" aria-live="polite"></span>
</div>
