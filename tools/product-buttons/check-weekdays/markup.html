<div class="pb pb-f pb-weekdays ck">
  <div class="ck-days" role="group" aria-label="Days of the week">
    <label class="ck-day"><input type="checkbox" checked aria-label="Monday"><i></i><b aria-hidden="true">M</b></label>
    <label class="ck-day"><input type="checkbox" checked aria-label="Tuesday"><i></i><b aria-hidden="true">T</b></label>
    <label class="ck-day"><input type="checkbox" checked aria-label="Wednesday"><i></i><b aria-hidden="true">W</b></label>
    <label class="ck-day"><input type="checkbox" checked aria-label="Thursday"><i></i><b aria-hidden="true">T</b></label>
    <label class="ck-day"><input type="checkbox" checked aria-label="Friday"><i></i><b aria-hidden="true">F</b></label>
    <label class="ck-day"><input type="checkbox" aria-label="Saturday"><i></i><b aria-hidden="true">S</b></label>
    <label class="ck-day"><input type="checkbox" aria-label="Sunday"><i></i><b aria-hidden="true">S</b></label>
  </div>
  <div class="ck-swap" aria-live="polite"><span class="on">Every weekday</span><span></span></div>
</div>
