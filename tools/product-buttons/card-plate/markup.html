<form class="pb pb-f cp pb-cardplate" data-step="number" novalidate>
  <div class="cp-plate">
    <div class="cp-row">
      <label class="cp-well">
        <input class="cp-num" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="Card number" aria-label="Card number" data-bwignore="true" data-1p-ignore="true" data-lpignore="true">
        <span class="cp-brand" aria-hidden="true"><span></span></span>
        <span class="cp-sweep" aria-hidden="true"></span>
        <span class="cp-line"><b></b><span class="cp-state" aria-hidden="true"><i class="wait">Linking</i><i class="ok"><svg viewBox="0 0 24 24"><path pathLength="1" d="m5 12.5 4.5 4.5L19 7.5"/></svg>Linked</i></span><button class="cp-edit" type="button" tabindex="-1">Change</button></span>
      </label>
    </div>
    <div class="cp-fold"><div><div class="cp-row">
      <label class="cp-well"><input class="cp-exp" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="MM / YY" aria-label="Expiry, month and year" data-bwignore="true" data-1p-ignore="true" data-lpignore="true"></label>
      <label class="cp-well"><input class="cp-cvc" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="CVC" aria-label="Security code" data-bwignore="true" data-1p-ignore="true" data-lpignore="true"></label>
    </div></div></div>
  </div>
  <span class="pb-sr" data-status role="status" aria-live="polite"></span>
</form>
