<div class="pb pb-cart" data-state="idle">
  <button class="pb-btn pb-add" type="button"><span class="pb-t" data-label="idle">Add to cart</span></button>
  <div class="pb-stepper" role="group" aria-label="Quantity">
    <button class="pb-step" type="button" data-step="-1" aria-label="Remove one" tabindex="-1">−</button>
    <span class="pb-qty"><span class="pb-n"><span>1</span></span> in cart</span>
    <button class="pb-step" type="button" data-step="1" aria-label="Add one" tabindex="-1">+</button>
  </div>
  <span class="pb-sr" data-status role="status" aria-live="polite"></span>
</div>
