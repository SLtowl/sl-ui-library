<form class="pb pb-promo" data-bwignore="true" data-state="idle" novalidate>
  <input class="pb-field" data-bwignore="true" data-1p-ignore="true" data-lpignore="true" data-form-type="other" type="text" name="pb-promo" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Try SPRING20" aria-label="Promo" tabindex="-1">
  <button class="pb-btn" type="submit" aria-expanded="false">
    <span class="pb-t" data-label="idle">Have a code?</span>
    <span class="pb-t" data-label="apply" aria-hidden="true">Apply</span>
    <span class="pb-t pb-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="pb-t" data-label="done" aria-hidden="true">Code applied</span>
    <span class="pb-t" data-label="remove" aria-hidden="true">Remove code</span>
  </button>
  <span class="pb-sr" data-status role="status" aria-live="polite"></span>
</form>
